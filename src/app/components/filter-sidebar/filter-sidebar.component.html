<div class="bg-gray-50 rounded-2xl shadow-sm p-6 sticky top-8">
  <h2 class="text-xl font-bold text-gray-800 mb-6">Refine Filters</h2>

  <!-- Layout -->
  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2"> Layout </label>
    <select
      [(ngModel)]="localLayout"
      name="layout"
      (change)="handleFilterChange()"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
    >
      <option value="">All Layouts</option>
      @for (l of LAYOUTS; track l) {
        <option [value]="l">{{ l }}</option>
      }
    </select>
  </div>

  <!-- Year Range -->
  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2"> Min Year </label>
    <input
      type="number"
      [(ngModel)]="localMinYear"
      name="minYear"
      (change)="handleFilterChange()"
      placeholder="0"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
    />
  </div>

  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2"> Max Year </label>
    <input
      type="number"
      [(ngModel)]="localMaxYear"
      name="maxYear"
      (change)="handleFilterChange()"
      placeholder="50"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
    />
  </div>

  <!-- Location -->
  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2"> Location </label>
    <select
      [(ngModel)]="localLocation"
      name="location"
      (change)="handleFilterChange()"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
    >
      <option value="">All Locations</option>
      @for (loc of LOCATIONS; track loc) {
        <option [value]="loc">{{ loc }}</option>
      }
    </select>
  </div>

  <!-- Floor -->
  <div class="mb-6">
    <label class="block text-sm font-medium text-gray-700 mb-2"> Floor </label>
    <select
      [(ngModel)]="localFloor"
      name="floor"
      (change)="handleFilterChange()"
      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
    >
      <option value="">All Floors</option>
      @for (f of FLOORS; track f) {
        <option [value]="f">{{ f }}</option>
      }
    </select>
  </div>

  <!-- Reset Button -->
  <button
    (click)="handleReset()"
    class="w-full bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded-lg hover:bg-gray-300 transition-colors duration-200"
  >
    Reset Filters
  </button>
</div>
